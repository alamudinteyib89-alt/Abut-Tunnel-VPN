
name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbutTunnelVPN-Android-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o AbutTunnelVPN-Android-Source.zip -d project
          find project -name build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abut-Tunnel-VPN-APK
          path: project/**/build/outputs/apk/debug/*.apk
