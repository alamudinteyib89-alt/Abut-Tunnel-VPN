
name: Build Abut Tunnel VPN APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AbutTunnelVPN-Android-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o AbutTunnelVPN-Android-Source.zip -d project
          find project -name build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Abut-Tunnel-VPN-APK
          path: project/**/build/outputs/apk/debug/*.apk
